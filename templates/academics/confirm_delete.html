{% extends 'base.html' %}

{% block title %}Confirm Delete - CampusCare{% endblock %}

{% block content %}
<div class="container mt-4">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card">
                <div class="card-header">
                    <h4 class="mb-0 text-danger">Confirm Deletion</h4>
                </div>
                <div class="card-body text-center">
                    <i class="fas fa-exclamation-triangle fa-3x text-warning mb-3"></i>
                    <h5>Are you sure you want to delete this note?</h5>
                    <p class="text-muted">"{{ object.title }}"</p>
                    <p class="text-danger"><strong>This action cannot be undone.</strong></p>
                    
                    <form method="post">
                        {% csrf_token %}
                        <div class="d-grid gap-2 d-md-flex justify-content-md-center">
                            <button type="submit" class="btn btn-danger">Yes, Delete Note</button>
                            <a href="{% url 'academics:manage_notes' %}" class="btn btn-secondary">Cancel</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
