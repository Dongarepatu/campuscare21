{% extends 'base.html' %}

{% block title %}Contact - CampusCare{% endblock %}

{% block content %}
<div class="container mt-5">
    <div class="row">
        <div class="col-lg-8 mx-auto">
            <h1 class="display-4 text-center mb-4">Contact Us</h1>
            
            <div class="row mt-5">
                <div class="col-md-6">
                    <h4>Get in Touch</h4>
                    <div class="mt-4">
                        <p><i class="fas fa-envelope me-2"></i> support@campuscare.edu</p>
                        <p><i class="fas fa-phone me-2"></i> +1 (555) 123-4567</p>
                        <p><i class="fas fa-map-marker-alt me-2"></i> 123 University Ave, Campus City</p>
                    </div>
                </div>
                <div class="col-md-6">
                    <h4>Send us a Message</h4>
                    <form class="mt-3">
                        <div class="mb-3">
                            <label for="name" class="form-label">Name</label>
                            <input type="text" class="form-control" id="name" required>
                        </div>
                        <div class="mb-3">
                            <label for="email" class="form-label">Email</label>
                            <input type="email" class="form-control" id="email" required>
                        </div>
                        <div class="mb-3">
                            <label for="message" class="form-label">Message</label>
                            <textarea class="form-control" id="message" rows="4" required></textarea>
                        </div>
                        <button type="submit" class="btn btn-primary">Send Message</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
